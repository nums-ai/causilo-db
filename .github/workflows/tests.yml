name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark]"
      - run: python -m pytest -q
      - name: Snowflake installer matches the core
        run: |
          python scripts/build_snowflake_sql.py
          git diff --exit-code sql/snowflake/install.sql
      - name: Snowflake Native App matches the core
        run: |
          python scripts/build_snowflake_app.py
          git diff --exit-code snowflake/native_app/
